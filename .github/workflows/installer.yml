name: Public installer acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version without v
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify public release download, default destination and uninstall
        env:
          SHIORI_INSTALL_VERSION: ${{ inputs.version }}
          EXPECTED_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          [[ "$SHIORI_INSTALL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl -fsSL "https://raw.githubusercontent.com/craftguild/shiori.rs/v${SHIORI_INSTALL_VERSION}/scripts/install.sh" -o "$RUNNER_TEMP/shiori-install.sh"
          env -u BINDIR sh "$RUNNER_TEMP/shiori-install.sh" --version "$SHIORI_INSTALL_VERSION"
          "$HOME/.local/bin/shiori" --version
          "$HOME/.local/bin/shiori" sbom > "$RUNNER_TEMP/installed.bom.json"
          curl -fsSL "https://github.com/craftguild/shiori.rs/releases/download/v${SHIORI_INSTALL_VERSION}/shiori-v${SHIORI_INSTALL_VERSION}-${EXPECTED_TARGET}.bom.json" -o "$RUNNER_TEMP/released.bom.json"
          cmp "$RUNNER_TEMP/installed.bom.json" "$RUNNER_TEMP/released.bom.json"
          env -u BINDIR sh "$RUNNER_TEMP/shiori-install.sh" --uninstall
          test ! -e "$HOME/.local/bin/shiori"
