name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the declared Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            . -> target
            tools/contract -> target
          cache-directories: .craftguild/cache/rust
      - name: Install the declared quality tools
        run: |
          cargo +1.95.0 install cargo-deny --version 0.19.8 --locked
          cargo +1.95.0 install tokei --version 15.0.0 --locked
      - name: Require the actual native target and clean source
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          test -z "$(git status --porcelain)"
      - name: Acquire the pinned engine, generator and locked dependencies
        run: |
          make setup setup-tools
          cargo fetch --locked
          cargo fetch --locked --manifest-path tools/contract/Cargo.toml
          npm --prefix tools/browser ci --ignore-scripts
          npm exec --prefix tools/browser -- playwright install --with-deps chromium
      - name: Run common and product checks
        run: make check
      - name: Build and accept the actual release executable
        run: |
          make build
          make acceptance
          make installer INSTALLER_ARGS=--check
      - name: Package and verify native assets
        run: |
          make package PACKAGE_ARGS="--group shiori --output $RUNNER_TEMP/shiori-assets"
          cd "$RUNNER_TEMP/shiori-assets"
          shasum -a 256 -c "SHA256SUMS-${{ matrix.target }}.txt"
      - name: Require unchanged source
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shiori-${{ matrix.target }}
          path: ${{ runner.temp }}/shiori-assets/*
          if-no-files-found: error
          retention-days: 30
