schema_version = "chigiri/config-v2"

[schema]
directory = "graphql"

[package]
name = "shiori-contract"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[generation]
output = "generated/shiori-contract"

[runtime]
source = "git"
url = "https://github.com/craftguild/chigiri.rs"
revision = "1d82bfc814f8b9c8ffb9d7d21b9816fd54b41b4c"
version = "0.2.1"

[consumer]
cargo_manifest = "crates/shiori/Cargo.toml"
package = "shiori"
generated_dependency = "generated"
all_targets = true

[bindings]
domain_enums = []
