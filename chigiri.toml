schema_version = "chigiri/config-v2"

[schema]
directory = "graphql"

[package]
name = "shiori-contract"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[generation]
output = "generated/shiori-contract"

[runtime]
source = "git"
url = "https://github.com/craftguild/chigiri.rs"
revision = "a21f2fce58a60ef1830f836da94c9a1a2ed95965"
version = "0.2.0"

[consumer]
cargo_manifest = "crates/shiori/Cargo.toml"
package = "shiori"
generated_dependency = "generated"
all_targets = true

[bindings]
domain_enums = []
