schema_version = "chigiri/config-v2"

[schema]
directory = "graphql"

[package]
name = "shiori-contract"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[generation]
output = "generated/shiori-contract"

[runtime]
source = "git"
url = "https://github.com/craftguild/chigiri.rs"
revision = "5f90235ddb705a1a394b9a5cfda23a9ea62dc4b6"
version = "0.1.1"

[consumer]
cargo_manifest = "crates/shiori/Cargo.toml"
package = "shiori"
generated_dependency = "generated"
all_targets = true

[bindings]
domain_enums = []
