type Query {
  post(id: ID!): Post
  posts(first: Int = 20, after: ID, before: ID, tag: String, query: String): PostConnection!
  postsByMonth(year: Int!, month: Int!, first: Int = 20, after: ID, before: ID): PostConnection!
  tags: [Tag!]!
  monthlyArchives: [MonthlyArchive!]!
}

type Subscription {
  contentChanged: ContentChange!
}

type ContentChange {
  revision: ID!
}

type Post {
  id: ID!
  title: String!
  author: String
  description: String!
  tags: [String!]!
  createdAt: String!
  updatedAt: String!
  sourcePath: String!
  document: Document
}

type PostConnection {
  nodes: [Post!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

type PageInfo {
  startCursor: ID
  hasPreviousPage: Boolean!
  endCursor: ID
  hasNextPage: Boolean!
}

type Tag {
  name: String!
  count: Int!
}

type MonthlyArchive {
  year: Int!
  month: Int!
  count: Int!
}

# The producer's flat typed structured schema version 2.
type Document {
  schemaVersion: Int!
  rootIds: [ID!]!
  nodes: [DocumentNode!]!
  referenceIds: [ID!]!
  footnoteIds: [ID!]!
  fonts: [DocumentFont!]!
  diagnostics: [DocumentDiagnostic!]!
}

union DocumentNode = DocumentRootNode | ParagraphNode | HeadingNode | FencedCodeNode | IndentedCodeNode | MathBlockNode | ThematicBreakNode | HtmlBlockNode | LinkReferenceDefinitionNode | BlockQuoteNode | ListNode | ListItemNode | GfmTableNode | TableRowNode | TableCellNode | BlankLineNode | CalloutNode | ForeignHtmlNode | TextNode | EmojiNode | CodeNode | MathNode | HtmlNode | SoftBreakNode | HardBreakNode | AnnotationNode | EmphasisNode | StrongNode | StrikethroughNode | LinkNode | ImageNode | FootnoteReferenceNode | ReferenceDefinitionNode | FootnoteDefinitionNode

type DocumentRootNode { id: ID! childIds: [ID!]! }
type ParagraphNode { id: ID! childIds: [ID!]! tight: Boolean! }
type HeadingNode { id: ID! childIds: [ID!]! level: Int! anchor: String! }
type FencedCodeNode { id: ID! source: String! language: String info: String! closed: Boolean! indent: Int! highlighting: CodeHighlighting svg: SvgContent }
type IndentedCodeNode { id: ID! source: String! language: String info: String! closed: Boolean! indent: Int! highlighting: CodeHighlighting }
type MathBlockNode { id: ID! source: String! display: Boolean! closed: Boolean! svg: SvgContent }
type ThematicBreakNode { id: ID! }
type HtmlBlockNode { id: ID! source: String! }
type LinkReferenceDefinitionNode { id: ID! source: String! }
type BlockQuoteNode { id: ID! childIds: [ID!]! }
type ListNode { id: ID! childIds: [ID!]! ordered: Boolean! loose: Boolean! marker: String! start: String }
type ListItemNode { id: ID! childIds: [ID!]! marker: String! checked: Boolean }
type GfmTableNode { id: ID! alignments: [TableAlignment!]! rowIds: [ID!]! }
type TableRowNode { id: ID! header: Boolean! cellIds: [ID!]! }
type TableCellNode { id: ID! childIds: [ID!]! }
type BlankLineNode { id: ID! }
type CalloutNode { id: ID! childIds: [ID!]! calloutKind: String! title: String }
type ForeignHtmlNode { id: ID! source: String! origin: String! trustLevel: DocumentTrustLevel! }
type TextNode { id: ID! text: String! }
type EmojiNode { id: ID! text: String! shortcode: String! }
type CodeNode { id: ID! source: String! }
type MathNode { id: ID! source: String! svg: SvgContent }
type HtmlNode { id: ID! source: String! tagfilter: Boolean! }
type SoftBreakNode { id: ID! }
type HardBreakNode { id: ID! }
type AnnotationNode { id: ID! childIds: [ID!]! annotationKind: String! annotationId: String! classes: [String!]! data: [AnnotationEntry!]! }
type EmphasisNode { id: ID! childIds: [ID!]! }
type StrongNode { id: ID! childIds: [ID!]! }
type StrikethroughNode { id: ID! childIds: [ID!]! }
type LinkNode { id: ID! childIds: [ID!]! destination: String! normalizedDestination: String! title: String }
type ImageNode { id: ID! altIds: [ID!]! destination: String! normalizedDestination: String! title: String presentation: ImagePresentation }
type FootnoteReferenceNode { id: ID! label: String! definitionId: ID ordinal: Int referenceAnchor: String definitionAnchor: String }
type ReferenceDefinitionNode { id: ID! label: String! destination: String! normalizedDestination: String! title: String }
type FootnoteDefinitionNode { id: ID! label: String! childIds: [ID!]! visible: Boolean! anchor: String! ordinal: Int backlinkIds: [String!]! }

enum TableAlignment { NONE LEFT CENTER RIGHT }
enum DocumentTrustLevel { UNTRUSTED SANITIZED TRUSTED }
enum SyntaxTokenKind { PLAIN ATTR_NAME BUILTIN CLASS_NAME COMMENT CONSTANT DELETED DOCTYPE FUNCTION INSERTED KEYWORD NUMBER OPERATOR PROPERTY PUNCTUATION SECTION STRING SYMBOL TAG URL VARIABLE }
enum FontEncoding { BASE64 }
enum DiagnosticSeverity { INFO WARNING ERROR }
enum DocumentDiagnosticEngine { CORE }

type CodeHighlighting { lines: [CodeLine!]! }
type CodeLine { tokens: [SyntaxToken!]! }
type SyntaxToken { kind: SyntaxTokenKind! text: String! }
type SvgContent { markup: String! width: Float height: Float baseline: Float fontIds: [ID!]! }
type DocumentFont { id: ID! family: String! mimeType: String! encoding: FontEncoding! content: String! }
type DocumentDiagnostic { severity: DiagnosticSeverity! code: String! message: String! nodeId: ID sourceRange: DocumentSourceRange engine: DocumentDiagnosticEngine! }
type DocumentSourceRange { startLine: Int! startColumn: Int! endLine: Int! endColumn: Int! }
type AnnotationEntry { key: String! value: String! }
type ImagePresentation { url: String! originalUrl: String! candidates: [ImageCandidate!]! sizes: String width: Int height: Int }
type ImageCandidate { url: String! width: Int! }
