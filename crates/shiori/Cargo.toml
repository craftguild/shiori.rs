[package]
name = "shiori"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
craftguild-cli = { git = "https://github.com/craftguild/standards.rs", rev = "be63eefb44a850a01f4cc065c66fff2fe558ee18" }
anyhow = "1.0.100"
futures-util = "0.3.31"
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "sha256"] }
base64 = "0.22"
axum = "0.8.8"
chigiri = { git = "https://github.com/craftguild/chigiri.rs", rev = "a21f2fce58a60ef1830f836da94c9a1a2ed95965", version = "=0.2.0", features = ["graphiql"] }
chigiri_axum = { git = "https://github.com/craftguild/chigiri.rs", rev = "a21f2fce58a60ef1830f836da94c9a1a2ed95965", version = "=0.2.0" }
generated = { package = "shiori-contract", path = "../../generated/shiori-contract" }
clap = { version = "4.5.53", features = ["derive"] }
lru = "0.18.5"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["std"] }
webp = { version = "=0.3.1", default-features = false }
img-parts = "=0.4.1"
oriha-core = { version = "=0.2.0", git = "https://github.com/craftguild/oriha.rs", rev = "deb0617d41d231a2d4f2ee1493aa081f9c3bfddd" }
mime_guess = "2.0.5"
notify = "8.2.0"
percent-encoding = "2.3.2"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["cors", "limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.7"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
scraper = "0.29"
base64 = "0.22"
png = "=0.18.1"
tokio = { version = "1.48.0", features = ["test-util"] }
http-body-util = "0.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }


[build-dependencies]
craftguild-cli-build = { git = "https://github.com/craftguild/standards.rs", rev = "be63eefb44a850a01f4cc065c66fff2fe558ee18" }
