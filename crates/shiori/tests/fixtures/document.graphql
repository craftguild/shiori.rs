fragment Structure on Document {
  schemaVersion rootIds referenceIds footnoteIds
  nodes {
    __typename
    ... on DocumentRootNode { id childIds }
    ... on ParagraphNode { id childIds tight }
    ... on HeadingNode { id childIds level anchor }
    ... on FencedCodeNode { id source language info closed indent }
    ... on IndentedCodeNode { id source language info closed indent }
    ... on MathBlockNode { id source display closed }
    ... on ThematicBreakNode { id }
    ... on HtmlBlockNode { id source }
    ... on LinkReferenceDefinitionNode { id source }
    ... on BlockQuoteNode { id childIds }
    ... on ListNode { id childIds ordered loose marker start }
    ... on ListItemNode { id childIds marker checked }
    ... on GfmTableNode { id alignments rowIds }
    ... on TableRowNode { id header cellIds }
    ... on TableCellNode { id childIds }
    ... on BlankLineNode { id }
    ... on CalloutNode { id childIds calloutKind title }
    ... on ForeignHtmlNode { id source origin trustLevel }
    ... on TextNode { id text }
    ... on EmojiNode { id text shortcode }
    ... on CodeNode { id source }
    ... on MathNode { id source }
    ... on HtmlNode { id source tagfilter }
    ... on SoftBreakNode { id }
    ... on HardBreakNode { id }
    ... on AnnotationNode { id childIds annotationKind annotationId classes data { key value } }
    ... on EmphasisNode { id childIds }
    ... on StrongNode { id childIds }
    ... on StrikethroughNode { id childIds }
    ... on LinkNode { id childIds destination normalizedDestination title }
    ... on ImageNode { id altIds destination normalizedDestination title }
    ... on FootnoteReferenceNode { id label definitionId ordinal referenceAnchor definitionAnchor }
    ... on ReferenceDefinitionNode { id label destination normalizedDestination title }
    ... on FootnoteDefinitionNode { id label childIds visible anchor ordinal backlinkIds }
  }
  diagnostics { severity code message nodeId }
}
query Documents($id: ID!, $prepare: Boolean!) {
  post(id: $id) {
    id title
    plain: document { ...Structure }
    rich: document {
      ...Structure
      nodes {
        ... on FencedCodeNode {
          h: highlighting @include(if: $prepare) { lines { tokens { kind text } } }
          svg @include(if: $prepare) { markup width height baseline fontIds }
        }
        ... on IndentedCodeNode { h: highlighting @include(if: $prepare) { lines { tokens { kind text } } } }
        ... on MathBlockNode { svg @include(if: $prepare) { markup width height baseline fontIds } }
        ... on MathNode { svg @include(if: $prepare) { markup width height baseline fontIds } }
        ... on ImageNode { presentation @include(if: $prepare) { url originalUrl candidates { url width } sizes width height } }
      }
      fonts @include(if: $prepare) { id family mimeType encoding content }
    }
  }
}
